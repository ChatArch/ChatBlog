<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-label="DeepSeek Harness plugin patch verification evidence">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style><![CDATA[
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e5edf7; }
      .subtitle { font: 500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9fb0c8; }
      .label { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e5edf7; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9fb0c8; }
      .mono { font: 500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; fill: #e5edf7; }
      .mono-small { font: 500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; fill: #9fb0c8; }
      .note { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #93a4bd; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#1e3a8a" opacity="0.14"/>
  <circle cx="90" cy="690" r="220" fill="#0f766e" opacity="0.12"/>
<text x="54" y="62" class="title">插件实践：目录里有文件不算，要证明 --patch 进了运行时</text>
<text x="56" y="96" class="subtitle">同一插件留下两类信号：宿主 apply() marker，以及模型路径能看到的 marker。</text>
<g filter="url(#shadow)">
  <rect x="70" y="150" width="240" height="150" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <rect x="70" y="150" width="240" height="6" rx="3" fill="#a78bfa"/>
  <text x="92" y="190" class="label">1 本地 Cordis 插件</text>
  <text x="92" y="220" class="small">
<tspan x="92" dy="0">export function apply(ctx)</tspan>
<tspan x="92" dy="23">ctx.systemPrompt.section(...)</tspan>
<tspan x="92" dy="23">ctx.effect(...)</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="380" y="150" width="230" height="150" rx="18" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <rect x="380" y="150" width="230" height="6" rx="3" fill="#fbbf24"/>
  <text x="402" y="190" class="label">2 patch overlay</text>
  <text x="402" y="220" class="small">
<tspan x="402" dy="0">insert: practice-plugin-marker</tspan>
<tspan x="402" dy="23">name: file://...plugin.mjs</tspan>
<tspan x="402" dy="23">传给 --patch</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="680" y="150" width="220" height="150" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
  <rect x="680" y="150" width="220" height="6" rx="3" fill="#60a5fa"/>
  <text x="702" y="190" class="label">3 headless run</text>
  <text x="702" y="220" class="small">
<tspan x="702" dy="0">dsh --profile headless</tspan>
<tspan x="702" dy="23">--patch plugin.patch.yml</tspan>
<tspan x="702" dy="23">一轮任务即退</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="970" y="150" width="200" height="150" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <rect x="970" y="150" width="200" height="6" rx="3" fill="#34d399"/>
  <text x="992" y="190" class="label">4 双重验证</text>
  <text x="992" y="220" class="small">
<tspan x="992" dy="0">apply-called</tspan>
<tspan x="992" dy="23">DSH_PRACTICE_PLUGIN_ACTIVE</tspan>
<tspan x="992" dy="23">PLUGIN_EXTENSION_VERIFIED=1</tspan>
</text>
</g><path d="M 310 225 C 345.0 225, 345.0 225, 380 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M 610 225 C 645.0 225, 645.0 225, 680 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M 900 225 C 935.0 225, 935.0 225, 970 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="82" y="390" width="1070" height="230" rx="20" fill="#050816" stroke="#263244" stroke-width="2"/><circle cx="116" cy="421" r="7" fill="#fb7185"/><circle cx="140" cy="421" r="7" fill="#fbbf24"/><circle cx="164" cy="421" r="7" fill="#34d399"/><text x="196" y="427" class="mono-small">headless plugin verification / sanitized log</text><text x="118" y="470" class="mono" fill="#e5edf7">$ dsh --profile headless --patch ./plugin.patch.yml &quot;return the practice marker&quot;</text>
<text x="118" y="495" class="mono" fill="#34d399">DSH_PRACTICE_PLUGIN_ACTIVE</text>
<text x="118" y="520" class="mono" fill="#9fb0c8"></text>
<text x="118" y="545" class="mono" fill="#e5edf7">$ cat plugin-mounted.marker</text>
<text x="118" y="570" class="mono" fill="#34d399">plugin=dsh-practice-plugin   event=apply-called</text>
<text x="118" y="595" class="mono" fill="#9fb0c8"></text>
<text x="118" y="620" class="mono" fill="#e5edf7">$ grep PLUGIN_EXTENSION_VERIFIED plugin-practice-run.log</text>
<text x="118" y="645" class="mono" fill="#34d399">PLUGIN_EXTENSION_VERIFIED=1</text>
</g><text x="82" y="675" class="note">相对路径曾失败，因为 loader 不是从 overlay 文件目录解析；公开图只保留结论，不暴露绝对路径。</text>
</svg>
