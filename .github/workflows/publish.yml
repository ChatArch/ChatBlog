name: Deploy Docs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chatblog-docs-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CHATBLOG_SITE_URL: https://arch.gh.wzhecnu.cn
          CHATBLOG_BASE_URL: /ChatBlog/
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site

          # Keep the PR preview tree if it already exists on gh-pages.
          if git fetch origin gh-pages --depth=1; then
            if git ls-tree -d --name-only FETCH_HEAD dev | grep -qx dev; then
              git archive FETCH_HEAD dev | tar -x -C _site
            fi
          fi

          cp -R build/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
