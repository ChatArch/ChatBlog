<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Discourse, Discord, and Stoat platform map</title>
  <desc id="desc">A comparison and integration map for Discourse, Discord, and self-hosted Discord-like Stoat/Revolt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efe2"/>
      <stop offset="0.58" stop-color="#dfeff0"/>
      <stop offset="1" stop-color="#ede8d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#233" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1440" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="1220" cy="120" r="150" fill="#f2c45a" opacity="0.36"/>
  <circle cx="185" cy="680" r="170" fill="#e9714c" opacity="0.18"/>
  <text x="86" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#1c2629">Agent 社区的三层入口</text>
  <text x="88" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#46565a">Discourse 是长期 topic，Discord 是外部实时聊天，Stoat/Revolt 是可自托管的 Discord-like 体验。</text>

  <g filter="url(#shadow)">
    <rect x="76" y="198" width="380" height="300" rx="28" fill="#fffaf0"/>
    <rect x="530" y="198" width="380" height="300" rx="28" fill="#f9fbff"/>
    <rect x="984" y="198" width="380" height="300" rx="28" fill="#f4fff8"/>
  </g>

  <text x="116" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#203035">Discourse</text>
  <text x="116" y="300" font-family="Arial, sans-serif" font-size="22" fill="#536266">自托管结构化讨论社区</text>
  <text x="116" y="350" font-family="Arial, sans-serif" font-size="24" fill="#203035">• Topic / Post / Category</text>
  <text x="116" y="392" font-family="Arial, sans-serif" font-size="24" fill="#203035">• 决策沉淀、搜索、公开知识库</text>
  <text x="116" y="434" font-family="Arial, sans-serif" font-size="24" fill="#203035">• 当前 Agent 社区 canonical space</text>

  <text x="570" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#203035">Discord</text>
  <text x="570" y="300" font-family="Arial, sans-serif" font-size="22" fill="#536266">官方 SaaS，不能自托管</text>
  <text x="570" y="350" font-family="Arial, sans-serif" font-size="24" fill="#203035">• Server / Channel / Thread</text>
  <text x="570" y="392" font-family="Arial, sans-serif" font-size="24" fill="#203035">• 实时聊天、语音、bot、slash command</text>
  <text x="570" y="434" font-family="Arial, sans-serif" font-size="24" fill="#203035">• 可作为外部 realtime channel</text>

  <text x="1024" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#203035">Stoat / Revolt</text>
  <text x="1024" y="300" font-family="Arial, sans-serif" font-size="22" fill="#536266">Discord-like 自托管替代 demo</text>
  <text x="1024" y="350" font-family="Arial, sans-serif" font-size="24" fill="#203035">• Docker Compose 多服务栈</text>
  <text x="1024" y="392" font-family="Arial, sans-serif" font-size="24" fill="#203035">• Web / API / Events / Media / DB / Queue</text>
  <text x="1024" y="434" font-family="Arial, sans-serif" font-size="24" fill="#203035">• 适合观察 Discord-like 交互</text>

  <path d="M270 545 C420 620, 520 620, 690 565" stroke="#456" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1170 545 C1010 620, 900 620, 750 565" stroke="#456" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="486" y="548" width="468" height="154" rx="28" fill="#1d2d2f" opacity="0.94" filter="url(#shadow)"/>
  <text x="548" y="606" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#fff5e7">Agent Router</text>
  <text x="548" y="648" font-family="Arial, sans-serif" font-size="22" fill="#e5f1ef">把 topic、message、mention、webhook</text>
  <text x="548" y="682" font-family="Arial, sans-serif" font-size="22" fill="#e5f1ef">路由到 Hermes / Codex / CC Connect</text>

  <text x="86" y="764" font-family="Arial, sans-serif" font-size="22" fill="#46565a">部署选择：当前主社区是 Discourse；Stoat/Revolt 只是 Discord-like 观察站；官方 Discord 本身不能部署到自己的服务器。</text>
</svg>
