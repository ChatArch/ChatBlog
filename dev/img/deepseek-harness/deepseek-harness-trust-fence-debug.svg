<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="DeepSeek Harness trust fence debug flow">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style><![CDATA[
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e5edf7; }
      .subtitle { font: 500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9fb0c8; }
      .label { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e5edf7; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9fb0c8; }
      .mono { font: 500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; fill: #e5edf7; }
      .mono-small { font: 500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; fill: #9fb0c8; }
      .note { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #93a4bd; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#1e3a8a" opacity="0.14"/>
  <circle cx="90" cy="690" r="220" fill="#0f766e" opacity="0.12"/>
<text x="54" y="62" class="title">部署卡点：页面打开了，workspace API 仍然会被 trust fence 拒绝</text>
<text x="56" y="96" class="subtitle">这次排障说明 Web UI 入口不是静态页面，Host / Origin / workspace API 边界必须一起验证。</text>
<g filter="url(#shadow)">
  <rect x="80" y="155" width="255" height="145" rx="18" fill="#111827" stroke="#fb7185" stroke-width="2"/>
  <rect x="80" y="155" width="255" height="6" rx="3" fill="#fb7185"/>
  <text x="102" y="195" class="label">现象</text>
  <text x="102" y="225" class="small">
<tspan x="102" dy="0">Web UI 能加载</tspan>
<tspan x="102" dy="23">添加 workspace 失败</tspan>
<tspan x="102" dy="23">host.listDirectory: 403</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="400" y="130" width="270" height="195" rx="18" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <rect x="400" y="130" width="270" height="6" rx="3" fill="#fbbf24"/>
  <text x="422" y="170" class="label">错误链路</text>
  <text x="422" y="200" class="small">
<tspan x="422" dy="0">浏览器 Origin = public host</tspan>
<tspan x="422" dy="23">public edge 改写 Host</tspan>
<tspan x="422" dy="23">后端看到 local host</tspan>
<tspan x="422" dy="23">Origin 与 Host 不一致</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="735" y="155" width="230" height="145" rx="18" fill="#111827" stroke="#fb7185" stroke-width="2"/>
  <rect x="735" y="155" width="230" height="6" rx="3" fill="#fb7185"/>
  <text x="757" y="195" class="label">Harness 拒绝</text>
  <text x="757" y="225" class="small">
<tspan x="757" dy="0">API trust fence</tspan>
<tspan x="757" dy="23">拒绝目录枚举</tspan>
<tspan x="757" dy="23">保护 workspace 边界</tspan>
</text>
</g><g filter="url(#shadow)">
  <rect x="1025" y="155" width="190" height="145" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <rect x="1025" y="155" width="190" height="6" rx="3" fill="#34d399"/>
  <text x="1047" y="195" class="label">修复</text>
  <text x="1047" y="225" class="small">
<tspan x="1047" dy="0">精确 vhost</tspan>
<tspan x="1047" dy="23">保留 Host: $host</tspan>
<tspan x="1047" dy="23">API 返回 200</tspan>
</text>
</g><path d="M 335 225 C 367.5 225, 367.5 225, 400 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M 670 225 C 702.5 225, 702.5 225, 735 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M 965 225 C 995.0 225, 995.0 225, 1025 225" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="110" y="405" width="1060" height="180" rx="20" fill="#050816" stroke="#263244" stroke-width="2"/><text x="140" y="452" class="mono" fill="#fb7185">before: /api/host.listDirectory with browser Origin → HTTP 403</text><text x="140" y="503" class="mono" fill="#34d399">after : preserve public Host at edge                 → HTTP 200</text><text x="140" y="554" class="mono" fill="#9fb0c8">scope : only boundary behavior is shown; service host names and internal routes are omitted</text></g><text x="80" y="662" class="note">这一步解释了为什么不能把 127.0.0.1:3080 随手反代出去就算部署完成。</text>
</svg>
