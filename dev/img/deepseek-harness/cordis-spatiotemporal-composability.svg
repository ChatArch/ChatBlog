<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cordis spatiotemporal composability map</title>
  <desc id="desc">A dark diagram showing why Cordis matters to DeepSeek Harness: components install revertible effects, declare reactive coeffects, run in fibers, and surface as an agent runtime with tools, prompt, sessions, UI, and sandbox seams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8bd5ff"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b6c7d9; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .box-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb5c7; }
      .pill { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #07111f; }
      .line { stroke: #8bd5ff; stroke-width: 2.2; fill: none; marker-end: url(#arrow); opacity: 0.88; }
      .muted-line { stroke: #64748b; stroke-width: 1.5; fill: none; opacity: 0.55; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="0" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="210" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="120" cy="590" r="250" fill="#34d399" opacity="0.07"/>

  <text x="70" y="72" class="title">Cordis paper: the runtime model underneath Harness</text>
  <text x="70" y="104" class="subtitle">Spatiotemporal composability turns plugin teardown and dependency resolution into first-class runtime rules.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="300" height="155" rx="24" fill="#0f172a" stroke="#1e3a4a"/>
    <rect x="92" y="177" width="116" height="26" rx="13" fill="url(#teal)"/>
    <text x="109" y="195" class="pill">time axis</text>
    <text x="92" y="233" class="box-title">Revertible effects</text>
    <text x="92" y="263" class="box-text">A component changes context</text>
    <text x="92" y="287" class="box-text">and returns an inverse.</text>
    <text x="92" y="313" class="small">Unload = replay tracked inverses.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="375" width="300" height="155" rx="24" fill="#0f172a" stroke="#273653"/>
    <rect x="92" y="397" width="122" height="26" rx="13" fill="url(#violet)"/>
    <text x="111" y="415" class="pill">space axis</text>
    <text x="92" y="453" class="box-title">Reactive coeffects</text>
    <text x="92" y="483" class="box-text">A component declares what</text>
    <text x="92" y="507" class="box-text">dependencies it needs.</text>
    <text x="92" y="533" class="small">Change = activate, deactivate, or stay.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="458" y="248" width="286" height="190" rx="28" fill="#111827" stroke="#35627a" stroke-width="1.2"/>
    <text x="496" y="295" class="box-title">Unified context</text>
    <text x="496" y="326" class="box-text">effects + coeffects</text>
    <text x="496" y="350" class="box-text">live in the same runtime</text>
    <text x="496" y="374" class="box-text">object, so components can</text>
    <text x="496" y="398" class="box-text">be loaded, unloaded, and</text>
    <text x="496" y="422" class="box-text">reconfigured without restart.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="825" y="145" width="305" height="390" rx="32" fill="#0b1220" stroke="#1d4ed8" stroke-opacity="0.65"/>
    <text x="867" y="195" class="box-title">DeepSeek Harness surface</text>
    <text x="867" y="232" class="box-text">profile / bundle / patch</text>
    <text x="867" y="266" class="box-text">system prompt sections</text>
    <text x="867" y="300" class="box-text">tool registry and guards</text>
    <text x="867" y="334" class="box-text">session event log</text>
    <text x="867" y="368" class="box-text">Web UI and host API</text>
    <text x="867" y="402" class="box-text">sandbox and approval seams</text>
    <rect x="867" y="444" width="212" height="42" rx="21" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8"/>
    <text x="897" y="471" class="small">agent runtime with lifecycle seams</text>
  </g>

  <path class="line" d="M370 233 C415 235 425 290 458 320"/>
  <path class="line" d="M370 452 C420 447 429 395 458 370"/>
  <path class="line" d="M744 343 C780 343 795 342 825 342"/>

  <path class="muted-line" d="M220 310 C270 342 300 364 340 390"/>
  <path class="muted-line" d="M220 375 C270 344 300 322 340 297"/>

  <text x="430" y="555" class="subtitle">Paper reading lens</text>
  <text x="430" y="587" class="box-text">The paper is useful because it explains why Harness treats plugins as lifecycle-owned</text>
  <text x="430" y="613" class="box-text">runtime participants. Tools, prompts, sessions, and UI hooks are installed into context,</text>
  <text x="430" y="639" class="box-text">and the runtime needs rules for withdrawing them safely.</text>
</svg>
