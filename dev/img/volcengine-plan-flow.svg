<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
<title id="title">AK/SK 与两套 Plan API Key 的使用路径</title><desc id="desc">AK/SK 只进入管理程序；生成或读取的 API Key 分别存入 Coding Plan 和 Agent Plan 配置，再用于模型调用。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="680" height="560" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
<text x="340" y="47" font-size="27" font-weight="700">两种凭据，两段调用</text>
<rect x="70" y="75" width="540" height="82" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="340" y="112" font-size="26" font-weight="650">AK / SK</text><text x="340" y="141" font-size="21">仅供管理程序签名使用</text>
<path d="M340 159 V190" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="200" width="540" height="95" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="340" y="237" font-size="25" font-weight="650">Ark 管理 API</text><text x="340" y="269" font-size="22">查套餐 → 查找 / 创建 Key → 读回</text>
<path d="M340 297 V323 H177 V347 M340 323 H503 V347" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="359" width="298" height="107" rx="12" fill="#dcfce7" stroke="#86efac"/>
<rect x="354" y="359" width="298" height="107" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
<text x="177" y="397" font-size="25" font-weight="650">Coding Plan</text><text x="177" y="429" font-size="22">Key + 套餐地址</text><text x="177" y="453" font-size="18">ChatEnv 命名配置</text>
<text x="503" y="397" font-size="25" font-weight="650">Agent Plan</text><text x="503" y="429" font-size="22">独立 Key + 套餐地址</text><text x="503" y="453" font-size="18">ChatEnv 命名配置</text>
<text x="340" y="517" font-size="23">模型程序只读对应 profile，不持有 AK/SK</text>
</g></svg>
