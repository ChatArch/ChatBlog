<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">手机网页实时录音转写自建架构</title>
  <desc id="desc">从手机浏览器 PWA 录音，到 WebSocket 或分片上传，再到 ASR Provider、LLM 会议纪要和知识归档的架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061325"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#34d399"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:34px;font-weight:800;fill:#f8fafc;letter-spacing:.5px}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:16px;fill:#cbd5e1}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:20px;font-weight:750;fill:#f8fafc}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:14px;fill:#cbd5e1}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:12px;fill:#94a3b8}
      .lane{fill:rgba(15,23,42,.68);stroke:#334155;stroke-width:1.2;rx:22}
      .frontend{fill:rgba(8,51,68,.62);stroke:#22d3ee;stroke-width:2;rx:14;filter:url(#shadow)}
      .backend{fill:rgba(6,78,59,.58);stroke:#34d399;stroke-width:2;rx:14;filter:url(#shadow)}
      .provider{fill:rgba(120,53,15,.50);stroke:#fbbf24;stroke-width:2;rx:14;filter:url(#shadow)}
      .store{fill:rgba(76,29,149,.50);stroke:#a78bfa;stroke-width:2;rx:14;filter:url(#shadow)}
      .risk{fill:rgba(136,19,55,.46);stroke:#fb7185;stroke-width:2;rx:14;filter:url(#shadow)}
      .line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}
      .lineGreen{fill:none;stroke:#34d399;stroke-width:3;marker-end:url(#arrowGreen)}
      .dash{fill:none;stroke:#fb7185;stroke-width:2.5;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <rect width="1400" height="860" fill="url(#grid)" opacity="0.72"/>
  <text x="60" y="70" class="title">手机网页实时录音转写：自建产品壳 + API Provider</text>
  <text x="60" y="104" class="subtitle">目标不是 meeting bot，也不是纯 ASR 厂商清单；而是手机浏览器点录音，实时/准实时出字，再接 AI 纪要。</text>

  <rect x="50" y="145" width="400" height="610" class="lane"/>
  <rect x="500" y="145" width="405" height="610" class="lane"/>
  <rect x="955" y="145" width="395" height="610" class="lane"/>
  <text x="80" y="185" class="label">1. 手机网页入口</text>
  <text x="530" y="185" class="label">2. 自建实时转写服务</text>
  <text x="985" y="185" class="label">3. AI 笔记与归档</text>

  <rect x="80" y="225" width="330" height="94" class="frontend"/>
  <text x="106" y="260" class="label">PWA / Mobile Web</text>
  <text x="106" y="286" class="sub">HTTPS 打开页面，点击录音</text>
  <text x="106" y="308" class="tiny">DiScribeWeb / Rec.AI 作为产品壳参考</text>

  <rect x="80" y="365" width="330" height="94" class="frontend"/>
  <text x="106" y="400" class="label">MediaRecorder</text>
  <text x="106" y="426" class="sub">手机麦克风授权，5–10 秒分片</text>
  <text x="106" y="448" class="tiny">audio/webm/opus 或 PCM；断点与重试</text>

  <rect x="80" y="505" width="330" height="120" class="risk"/>
  <text x="106" y="540" class="label">移动端关键风险</text>
  <text x="106" y="568" class="sub">锁屏 / 切后台 / 网络抖动</text>
  <text x="106" y="590" class="sub">iOS Safari 行为、长录音恢复</text>
  <text x="106" y="612" class="tiny">先做真机 30–60 分钟 smoke</text>

  <rect x="535" y="225" width="330" height="94" class="backend"/>
  <text x="561" y="260" class="label">Session + Chunk API</text>
  <text x="561" y="286" class="sub">session_id / chunk_index / progress</text>
  <text x="561" y="308" class="tiny">上传保存、去重、失败片段重试</text>

  <rect x="535" y="365" width="330" height="94" class="backend"/>
  <text x="561" y="400" class="label">WebSocket / SSE</text>
  <text x="561" y="426" class="sub">partial / final transcript 推回页面</text>
  <text x="561" y="448" class="tiny">参考 gtselentis realtime-transcription</text>

  <rect x="535" y="505" width="330" height="120" class="provider"/>
  <text x="561" y="540" class="label">ASR Provider Adapter</text>
  <text x="561" y="568" class="sub">腾讯云 / 讯飞 / DashScope / Azure</text>
  <text x="561" y="590" class="sub">Amazon / Deepgram / OpenAI-compatible</text>
  <text x="561" y="612" class="tiny">Provider 是插件，不是产品本身</text>

  <rect x="990" y="225" width="320" height="94" class="store"/>
  <text x="1016" y="260" class="label">Transcript Store</text>
  <text x="1016" y="286" class="sub">segments、timestamps、speaker hints</text>
  <text x="1016" y="308" class="tiny">保留原始分片和最终合并稿</text>

  <rect x="990" y="365" width="320" height="94" class="store"/>
  <text x="1016" y="400" class="label">LLM Notes</text>
  <text x="1016" y="426" class="sub">会议纪要、行动项、想法笔记</text>
  <text x="1016" y="448" class="tiny">模板化 prompt，可按场景定制</text>

  <rect x="990" y="505" width="320" height="120" class="store"/>
  <text x="1016" y="540" class="label">知识工作流</text>
  <text x="1016" y="568" class="sub">Markdown / 飞书文档 / 搜索</text>
  <text x="1016" y="590" class="sub">任务、决策、问题、后续 Agent</text>
  <text x="1016" y="612" class="tiny">接 ChatArch workspace / 文档沉淀</text>

  <path class="line" d="M410 272 C460 272 480 272 535 272"/>
  <path class="line" d="M410 412 C470 412 477 412 535 412"/>
  <path class="lineGreen" d="M865 272 C918 272 940 272 990 272"/>
  <path class="lineGreen" d="M865 412 C918 412 940 412 990 412"/>
  <path class="lineGreen" d="M865 565 C918 565 940 565 990 565"/>
  <path class="dash" d="M245 459 C245 484 245 494 245 505"/>

  <rect x="80" y="675" width="1230" height="54" rx="16" fill="rgba(15,23,42,.78)" stroke="#475569"/>
  <text x="110" y="708" class="sub">落地顺序：先验证手机录音稳定性和实时 partial transcript，再替换中文 ASR Provider，最后做 LLM 纪要模板和知识归档。</text>
  <text x="60" y="810" class="tiny">原创图：ChatBlog / ChatArch。用于解释本篇的推荐组合，不表示任何单个 GitHub 项目已完整覆盖全部模块。</text>
</svg>
