<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">网页按钮实时录音转写主流架构</title>
  <desc id="desc">一个网页录音按钮，通过浏览器麦克风采集音频，连接成熟实时 ASR provider，显示实时字幕，并在停止后生成 AI 笔记。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061325"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#34d399"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:34px;font-weight:800;fill:#f8fafc;letter-spacing:.5px}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:16px;fill:#cbd5e1}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:20px;font-weight:750;fill:#f8fafc}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:14px;fill:#cbd5e1}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:12px;fill:#94a3b8}
      .lane{fill:rgba(15,23,42,.68);stroke:#334155;stroke-width:1.2;rx:22}
      .frontend{fill:rgba(8,51,68,.62);stroke:#22d3ee;stroke-width:2;rx:14;filter:url(#shadow)}
      .backend{fill:rgba(6,78,59,.58);stroke:#34d399;stroke-width:2;rx:14;filter:url(#shadow)}
      .provider{fill:rgba(120,53,15,.50);stroke:#fbbf24;stroke-width:2;rx:14;filter:url(#shadow)}
      .store{fill:rgba(76,29,149,.50);stroke:#a78bfa;stroke-width:2;rx:14;filter:url(#shadow)}
      .line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}
      .lineGreen{fill:none;stroke:#34d399;stroke-width:3;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect width="1400" height="760" fill="url(#grid)" opacity="0.72"/>
  <text x="60" y="70" class="title">网页按钮实时录音转写：成熟路线不是 Bot，而是 Live ASR Web SDK</text>
  <text x="60" y="104" class="subtitle">打开网页 → 点录音 → 实时字幕 → 停止后 AI 笔记。产品壳可以很薄，关键是选成熟实时转写 provider / 官方 starter。</text>

  <rect x="50" y="145" width="300" height="460" class="lane"/>
  <rect x="390" y="145" width="300" height="460" class="lane"/>
  <rect x="730" y="145" width="300" height="460" class="lane"/>
  <rect x="1070" y="145" width="280" height="460" class="lane"/>

  <text x="80" y="185" class="label">1. 一颗网页按钮</text>
  <rect x="80" y="225" width="240" height="105" class="frontend"/>
  <text x="104" y="260" class="label">Start Recording</text>
  <text x="104" y="288" class="sub">getUserMedia / 麦克风权限</text>
  <text x="104" y="310" class="tiny">手机/电脑浏览器都可以打开</text>
  <rect x="80" y="375" width="240" height="105" class="frontend"/>
  <text x="104" y="410" class="label">Audio Stream</text>
  <text x="104" y="438" class="sub">MediaRecorder / AudioWorklet</text>
  <text x="104" y="460" class="tiny">WebSocket 或 provider SDK</text>

  <text x="420" y="185" class="label">2. 成熟实时 ASR</text>
  <rect x="420" y="225" width="240" height="105" class="provider"/>
  <text x="444" y="260" class="label">Official Starters</text>
  <text x="444" y="288" class="sub">Deepgram / AssemblyAI</text>
  <text x="444" y="310" class="tiny">网页实时字幕最快 MVP</text>
  <rect x="420" y="375" width="240" height="105" class="provider"/>
  <text x="444" y="410" class="label">Cloud SDKs</text>
  <text x="444" y="438" class="sub">Azure / OpenAI / Amazon</text>
  <text x="444" y="460" class="tiny">中文/企业云/生态选择</text>

  <text x="760" y="185" class="label">3. 页面实时显示</text>
  <rect x="760" y="225" width="240" height="105" class="backend"/>
  <text x="784" y="260" class="label">Partial Text</text>
  <text x="784" y="288" class="sub">边说边改，上文可修正</text>
  <text x="784" y="310" class="tiny">interim transcript events</text>
  <rect x="760" y="375" width="240" height="105" class="backend"/>
  <text x="784" y="410" class="label">Final Segments</text>
  <text x="784" y="438" class="sub">稳定字幕片段 + 时间戳</text>
  <text x="784" y="460" class="tiny">停止后合并全文</text>

  <text x="1100" y="185" class="label">4. AI 笔记</text>
  <rect x="1100" y="225" width="220" height="105" class="store"/>
  <text x="1124" y="260" class="label">LLM Notes</text>
  <text x="1124" y="288" class="sub">会议纪要 / 行动项</text>
  <text x="1124" y="310" class="tiny">停止后生成即可</text>
  <rect x="1100" y="375" width="220" height="105" class="store"/>
  <text x="1124" y="410" class="label">Archive</text>
  <text x="1124" y="438" class="sub">Markdown / 飞书 / 搜索</text>
  <text x="1124" y="460" class="tiny">后续工作流再扩展</text>

  <path class="line" d="M320 278 C355 278 378 278 420 278"/>
  <path class="line" d="M660 278 C695 278 718 278 760 278"/>
  <path class="lineGreen" d="M1000 278 C1035 278 1058 278 1100 278"/>
  <path class="lineGreen" d="M1000 428 C1035 428 1058 428 1100 428"/>

  <rect x="80" y="640" width="1240" height="54" rx="16" fill="rgba(15,23,42,.78)" stroke="#475569"/>
  <text x="110" y="673" class="sub">推荐起步：Deepgram Next.js Live Transcription 或 AssemblyAI Browser Realtime Example；再加自己的 token broker 和 AI notes 后端。</text>
  <text x="60" y="724" class="tiny">原创图：ChatBlog / ChatArch。用于解释重写后的主线：成熟实时 ASR Web SDK / 官方 starter + 自建薄网页壳。</text>
</svg>
