<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">网页录音到 AI 纪要主流架构</title>
  <desc id="desc">从网页录音按钮开始，分成熟 ASR API、自托管 ASR 和现成产品三条路线，最终进入实时字幕、AI 纠错和会议纪要。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#93a4bd"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #b6c2d6; }
      .cardTitle { font: 700 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; }
      .cardText { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #d7e0ef; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aab7ca; }
      .label { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .muted { fill: #aab7ca; }
      .arrow { stroke: #93a4bd; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1280" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1160" cy="80" r="170" fill="#2563eb" opacity="0.09"/>
  <circle cx="80" cy="690" r="210" fill="#22c55e" opacity="0.07"/>

  <text x="58" y="62" class="title">网页录音到 AI 纪要：先选成熟 ASR</text>
  <text x="58" y="94" class="subtitle">一个网页按钮不是难点；真正要验证的是实时 ASR 成熟度，以及有没有现成产品已经打通录音、转写、总结。</text>

  <!-- Browser input -->
  <g filter="url(#shadow)">
    <rect x="58" y="150" width="260" height="150" rx="22" fill="#1f2a44" stroke="#334155"/>
    <circle cx="98" cy="199" r="26" fill="url(#blue)"/>
    <text x="90" y="208" class="label">REC</text>
    <text x="136" y="188" class="cardTitle">网页录音入口</text>
    <text x="82" y="235" class="cardText">getUserMedia / AudioWorklet</text>
    <text x="82" y="260" class="cardText">Start / Stop / 实时字幕区域</text>
    <text x="82" y="283" class="small">手机或电脑浏览器打开 URL</text>
  </g>

  <!-- Route A provider -->
  <g filter="url(#shadow)">
    <rect x="405" y="128" width="330" height="162" rx="22" fill="#1e3a5f" stroke="#3b82f6"/>
    <rect x="430" y="153" width="112" height="26" rx="13" fill="url(#blue)"/>
    <text x="449" y="172" class="label">路线 A</text>
    <text x="430" y="207" class="cardTitle">成熟 ASR API</text>
    <text x="430" y="236" class="cardText">Deepgram / AssemblyAI / Azure</text>
    <text x="430" y="260" class="cardText">OpenAI Realtime / 国内云 ASR</text>
    <text x="430" y="282" class="small">最快验证网页实时字幕体验</text>
  </g>

  <!-- Route B self hosted -->
  <g filter="url(#shadow)">
    <rect x="405" y="335" width="330" height="172" rx="22" fill="#163d34" stroke="#10b981"/>
    <rect x="430" y="360" width="112" height="26" rx="13" fill="url(#green)"/>
    <text x="449" y="379" class="label">路线 B</text>
    <text x="430" y="414" class="cardTitle">自托管 ASR runtime</text>
    <text x="430" y="443" class="cardText">FunASR / sherpa-onnx</text>
    <text x="430" y="467" class="cardText">WhisperLive / faster-whisper</text>
    <text x="430" y="491" class="small">数据可控，但要维护模型和算力</text>
  </g>

  <!-- Route C product -->
  <g filter="url(#shadow)">
    <rect x="405" y="552" width="330" height="144" rx="22" fill="#3b2a63" stroke="#8b5cf6"/>
    <rect x="430" y="577" width="112" height="26" rx="13" fill="url(#purple)"/>
    <text x="449" y="596" class="label">路线 C</text>
    <text x="430" y="631" class="cardTitle">现成产品优先试</text>
    <text x="430" y="660" class="cardText">Speakr / Scriberr / Meetily</text>
    <text x="430" y="684" class="small">能复用就不要从零造产品壳</text>
  </g>

  <!-- transcript bus -->
  <g filter="url(#shadow)">
    <rect x="830" y="238" width="340" height="160" rx="22" fill="#202b45" stroke="#475569"/>
    <text x="858" y="280" class="cardTitle">Transcript Event Bus</text>
    <text x="858" y="315" class="cardText">partial：边说边显示</text>
    <text x="858" y="340" class="cardText">final：稳定片段入库</text>
    <text x="858" y="365" class="cardText">timecode / provider / speaker</text>
  </g>

  <!-- AI notes -->
  <g filter="url(#shadow)">
    <rect x="830" y="465" width="340" height="166" rx="22" fill="#2b314d" stroke="#64748b"/>
    <text x="858" y="508" class="cardTitle">AI 纠错与会议纪要</text>
    <text x="858" y="542" class="cardText">实时：术语修正 / 标点 / 段落</text>
    <text x="858" y="568" class="cardText">结束：摘要 / 行动项 / 标签</text>
    <text x="858" y="594" class="cardText">保留原文 + 修订稿 + 笔记</text>
  </g>

  <!-- arrows -->
  <path class="arrow" d="M318 225 C350 225, 365 209, 400 209"/>
  <path class="arrow" d="M318 225 C360 270, 365 421, 400 421"/>
  <path class="arrow dash" d="M318 225 C350 360, 350 625, 400 625"/>
  <path class="arrow" d="M735 209 C780 215, 800 285, 827 305"/>
  <path class="arrow" d="M735 421 C783 421, 800 358, 827 340"/>
  <path class="arrow dash" d="M735 625 C788 605, 808 396, 827 360"/>
  <path class="arrow" d="M1000 398 L1000 462"/>

  <!-- bottom note -->
  <g>
    <rect x="58" y="642" width="260" height="54" rx="18" fill="#111827" stroke="#334155"/>
    <text x="82" y="667" class="small">决策顺序：先试 Speakr 成品，</text>
    <text x="82" y="687" class="small">并行测 ASR；不行再自建薄网页。</text>
  </g>

  <text x="58" y="732" class="small muted">核心判断：ASR 是成熟能力；产品层要么复用 Speakr/Scriberr，要么围绕成熟 ASR 自建一层很薄的网页与 notes 后端。</text>
</svg>
