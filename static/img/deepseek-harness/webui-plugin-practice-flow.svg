<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness web UI and plugin practice flow</title>
  <desc id="desc">A practice flow diagram showing deployment, web UI task execution, test verification, plugin patch insertion, host-side marker verification, and prompt injection verification.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#182033"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
      .lane{rx:26;fill:#111827;stroke:#334155;stroke-width:2;filter:url(#shadow2)}
      .card{rx:18;filter:url(#shadow2)}
      .h{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
      .t{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e5e7eb}
      .s{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
      .arrow{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#arrow2)}
      .ok{fill:#22c55e}
    </style>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="70" y="66" class="title">一次端到端实践：从 Web UI 修 bug 到插件注入上下文</text>
  <text x="70" y="100" class="subtitle">实践目标：验证 agent runtime 能读代码、改代码、跑测试、记录结果、加载插件。</text>

  <rect x="70" y="140" width="1140" height="175" class="lane"/>
  <text x="105" y="180" class="h">A. Web UI 任务链路</text>
  <rect x="105" y="205" width="160" height="75" fill="#2563eb" class="card"/>
  <text x="128" y="237" class="t">添加 workspace</text>
  <text x="128" y="260" class="s">受控小仓库</text>
  <rect x="315" y="205" width="160" height="75" fill="#7c3aed" class="card"/>
  <text x="338" y="237" class="t">自然语言任务</text>
  <text x="338" y="260" class="s">修百分比 bug</text>
  <rect x="525" y="205" width="160" height="75" fill="#0f766e" class="card"/>
  <text x="548" y="237" class="t">读文件 / 改文件</text>
  <text x="548" y="260" class="s">Read + Edit</text>
  <rect x="735" y="205" width="160" height="75" fill="#b45309" class="card"/>
  <text x="758" y="237" class="t">运行 npm test</text>
  <text x="758" y="260" class="s">Bash tool</text>
  <rect x="945" y="205" width="220" height="75" fill="#15803d" class="card"/>
  <text x="972" y="237" class="t">写 PRACTICE_RESULT</text>
  <text x="972" y="260" class="s">测试通过 + 结果回读</text>
  <path d="M265 243 H315" class="arrow"/><path d="M475 243 H525" class="arrow"/><path d="M685 243 H735" class="arrow"/><path d="M895 243 H945" class="arrow"/>

  <rect x="70" y="365" width="1140" height="190" class="lane"/>
  <text x="105" y="405" class="h">B. 插件扩展链路</text>
  <rect x="105" y="430" width="180" height="82" fill="#334155" class="card"/>
  <text x="128" y="462" class="t">本地 ESM 插件</text>
  <text x="128" y="486" class="s">export apply(ctx)</text>
  <rect x="335" y="430" width="180" height="82" fill="#334155" class="card"/>
  <text x="358" y="462" class="t">--patch insert</text>
  <text x="358" y="486" class="s">profile overlay</text>
  <rect x="565" y="430" width="180" height="82" fill="#334155" class="card"/>
  <text x="588" y="462" class="t">Loader import/apply</text>
  <text x="588" y="486" class="s">宿主 marker 写入</text>
  <rect x="795" y="430" width="180" height="82" fill="#334155" class="card"/>
  <text x="818" y="462" class="t">systemPrompt.section</text>
  <text x="818" y="486" class="s">注入模型上下文</text>
  <rect x="1025" y="430" width="140" height="82" fill="#15803d" class="card"/>
  <text x="1050" y="462" class="t">模型回读</text>
  <text x="1050" y="486" class="s">marker</text>
  <path d="M285 471 H335" class="arrow"/><path d="M515 471 H565" class="arrow"/><path d="M745 471 H795" class="arrow"/><path d="M975 471 H1025" class="arrow"/>

  <rect x="105" y="600" width="320" height="52" rx="16" fill="#052e16" stroke="#16a34a"/>
  <circle cx="132" cy="626" r="9" class="ok"/><text x="154" y="631" class="s">Web UI 工具链：Read / Edit / Bash / Write 全部真实发生</text>
  <rect x="480" y="600" width="320" height="52" rx="16" fill="#052e16" stroke="#16a34a"/>
  <circle cx="507" cy="626" r="9" class="ok"/><text x="529" y="631" class="s">插件链路：宿主 marker 与 prompt marker 分别验证</text>
  <rect x="855" y="600" width="310" height="52" rx="16" fill="#451a03" stroke="#f59e0b"/>
  <text x="883" y="631" class="s">安全口径：公开文章只写模式，不发布内部 live 入口</text>
</svg>
